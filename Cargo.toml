[package]
name = "vetis-ws"
version = "0.1.0-beta.1"
edition = "2024"
authors = ["Rogerio Araújo <rogerio.araujo@gmail.com>"]
repository = "https://github.com/vetis-server/vetis-ws"
homepage = "https://github.com/vetis-server/vetis"
description = "Very Tiny Server websockets support"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["http", "modules", "websockets", "vetis"]
publish = true
rust-version = "1.85.0"

[features]
default = ["runtime-tokio"]

runtime-tokio = ["dep:tokio"]

[dependencies]
base64 = "0.23.1"
http = "1.5.0"
hyper = { version = "1.10.1", default-features = false, features = [
    "http1",
    "server",
] }
hyper-util = { version = "0.1.21", default-features = false, features = [
    "server",
    "http1",
    "tokio",
] }
pin-project-lite = "0.2.17"
tokio = { version = "1.53.1", optional = true }
vetis = { version = "0.1.7-beta.6" }
ws-framer = "0.3.2"

[dev-dependencies]
caramelo = "0.1.5"
deboa = { version = "0.1.5-beta.7" }
deboa-tokio = { version = "0.1.4-beta.8", default-features = false, features = [
    "http2",
    "rust-tls",
    "default-rustls-provider",
    "default-rustls-verifier",
] }
deboa-ws = { version = "0.1.0-beta.4" }
serde_yaml_ng = "0.10.0"
tokio = { version = "1.53.1", default-features = false, features = ["macros"] }
vetis-tokio = { version = "0.1.2-beta.8", features = ["rust-tls"] }
